<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
            *{
            margin: 0%;
            padding: 0;
            box-sizing: border-box;
            text-transform: capitalize;
        }
        .con{
            height:100vh;
            border: 1px solid black;
            background:linear-gradient(90deg,skyblue, violet);
            display: flex;
            align-items: center;
            justify-content: center;
        }
         form{
            height: 70%;
            width: 30%;
            /* border: 1px solid black; */
            background-color: white;
            text-align: center;
            border-radius: 20px;
         }
        label{
            width: 80%;
            text-align: left;
        }
        input{
            width: 90%;
            border: 1px solid grey;
            height: 40%;
            background-color: whitesmoke;
            border-radius: 10px;
            margin-top: 2%;
        }
        .user, .password, .button{
            height: 20%;
            width: 80%;
            margin: auto;
        }
        h1{
            margin: 10% 0 10% 0;
        }
        button{
            background:linear-gradient(90deg,skyblue, violet);
            height: 40%;
            width: 90%; 
            border-radius: 15px;
            border: none;
            margin-top: 7%;
        }
        a{
            text-decoration: none;
            color: black;
        }  
        a:hover{
            font-size: 20px;
            text-decoration:underline;
        }      
    </style>
</head>
<body>
    <div class="con">
        <form action="">
            <h1 align="center">Login Form </h1>
            <div class="user">
            <label for="">Username:</label><br>
            <input type="text" placeholder="E.g-xyz@gmail.com">
            </div>
            <div class="password">
            <label for="">Password:</label><br>
            <input type="password" placeholder="E.g -345623465">
            </div>
            <div class="button">
                <p>Forget password?<a href="sign-up.html">Sign up</a> </p>
                <!-- <input type="submit" class="submit"> -->
                 <button>Submit</button>
            </div>
        </form>
    </div>
</body>
</html>
