<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body{
            height: 100vh;
            background: linear-gradient(90deg,skyblue,violet);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        form{
            height: 70%;
            width: 30%;
            background-color: white;
            border-radius: 10px;
        }
        .email,.basic,.password,.button{
            width: 90%;
            margin: auto;
            margin-top:3.5%;
        }
        .w{
            width: 60%;
            height: 20px;
            margin-right: 0;
        }
        input{
            margin-top: 3.5%;
            background-color: rgb(232, 232, 232);
            border: none;
            width: 20%;
            border-radius: 5px;
        }
        button{
            height: 50%;
            width: 100%;
            background: linear-gradient(90deg,skyblue,violet);
            color: white;
            border: none;
            border-radius: 10px;
            margin-top: 3%;
        }
        .button{
            height: 20%;
            text-align: center;
        }
        p{
            margin-top: 3%;
        }
        h1{
            margin-top:5%;
        }
        label{
            margin-left: 2%;
        }
    </style>
</head>
<body>
    <form action="">
        <h1 align="center">Sign Up</h1>
        <div class="basic">
            <label for="">First Name :</label>
            <input type="text" class="w"><br>
            <label for="">Last Name :</label>
            <input type="text" class="w"><br>
            <label for="">Gender :</label>
            <input type="radio" name="Gender" id="">Male
            <input type="radio" name="Gender" id="">Female<br>
            <label for="">Date Of Birth:</label>
            <input type="date" name="" class="w"><br>
            <label for="">Mobile No:</label>
            <input type="tel" name="" class="w">
        </div>
        <div class="email">
            <label for="">Email:</label>
            <input type="email" name="" class="w"><br>
            <label for="">Confirm Email:</label>
            <input type="email" name="" class="w"><br>
        </div>
        <div class="password">
            <label for="">Password:</label>
            <input type="password" name="" class="w"><br>
            <label for="">Confirm Password:</label>
            <input type="password" name="" class="w"><br>
        </div>
        <div class="button">
            <input type="checkbox" name="" id="">Terms And Conditions <br>
            <button>Sign Up</button>
            <p>Already a Member ? <a href="log-in.html">LOGIN</a></p>
        </div>

    </form>
    
</body>
</html>
